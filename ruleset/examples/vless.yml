# VLESS/REALITY detection rules for OpenGFW
#
# Available vless properties:
#   vless.yes    (bool)   — heuristic score >= 50
#   vless.score  (int)    — 0-100 confidence
#   vless.sni    (string) — ClientHello SNI (empty if not found)
#   vless.alpn   ([]string) — negotiated ALPN protocols
#   vless.probes (int)    — reserved for active probing

# Block all detected VLESS traffic
- name: "block vless all"
  action: block
  expr: vless.yes

# Block high-confidence VLESS (score >= 75 out of 100)
- name: "block vless high"
  action: block
  expr: vless.score >= 75

# Block VLESS on non-standard ports (very strong signal)
- name: "block vless non-443"
  action: block
  expr: vless.yes && port.dst != 443

# Block VLESS with known proxy SNI targets
- name: "block vless proxy snis"
  action: block
  expr: >-
    vless.yes && (
      vless.sni contains "microsoft.com" ||
      vless.sni contains "apple.com" ||
      vless.sni contains "icloud.com" ||
      vless.sni contains "amazon.com" ||
      vless.sni contains "github.com" ||
      vless.sni contains "cloudfront.net"
    )

# GeoIP + SNI mismatch (VLESS with US company SNI but non-US server)
- name: "block vless geo mismatch"
  action: block
  expr: >-
    vless.yes &&
    (vless.sni contains "microsoft.com" ||
     vless.sni contains "apple.com") &&
    !geoip(ip.dst, "US")

# Passive Trojan detection
- name: "block trojan"
  action: block
  expr: trojan.yes
